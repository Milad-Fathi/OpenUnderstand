name: CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel
        pip install -r requirements.txt 2>/dev/null || echo "No requirements.txt"
        pip install .
        pip install pytest pytest-cov coverage ruff
    
    - name: Lint with ruff
      run: |
        # Only check your test files and ignore existing issues
        ruff check tests/ openunderstand/ --statistics --exit-zero
        # Or check only your files
        ruff check tests/
    
    - name: Run tests with coverage
      run: |
        pytest -v --cov=openunderstand --cov-report=term --cov-report=xml --cov-report=html --cov-branch
    
    - name: Check coverage threshold
      run: |
        echo "Checking coverage quality gates..."
        coverage report --fail-under=80
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: coverage_html/
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: .pytest_cache/