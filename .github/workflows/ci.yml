name: CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel
        pip install -r requirements.txt 2>/dev/null || echo "No requirements.txt"
        pip install .
        pip install pytest pytest-cov coverage ruff
    
    - name: Lint with ruff
      run: |
        # Only check your test files - these should be clean
        ruff check tests/ --output-format=github
    
    - name: Run tests with coverage
      run: |
        pytest -v --cov=openunderstand --cov-report=term --cov-report=xml --cov-report=html --cov-branch tests/ Tests_G9.py test_openunderstand.py test_run.py
    
    - name: Check line coverage threshold
      run: |
        echo "Checking line coverage..."
        coverage report --fail-under=80

    - name: Check branch coverage threshold
      run: |
        echo "Checking branch coverage..."
        # Get branch coverage from coverage report
        BRANCH_COVERAGE=$(coverage report | grep TOTAL | awk '{print $6}' | sed 's/%//')
        echo "Branch coverage: ${BRANCH_COVERAGE}%"
        if [ -n "$BRANCH_COVERAGE" ] && [ "$BRANCH_COVERAGE" -lt 70 ]; then
          echo "Branch coverage ${BRANCH_COVERAGE}% is below 70%!"
          exit 1
        else
          echo "Branch coverage meets 70% threshold!"
        fi

    - name: Upload coverage HTML
      uses: actions/upload-artifact@v4
      with:
        name: coverage-html
        path: coverage_html/
    
    - name: Upload coverage XML
      uses: actions/upload-artifact@v4
      with:
        name: coverage-xml
        path: coverage.xml
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: .pytest_cache/