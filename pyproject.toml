[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openunderstand"
dynamic = ["version", "description", "authors", "readme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short --cov=openunderstand --cov-report=term-missing --cov-report=html:coverage_html --cov-report=xml:coverage.xml --cov-branch --maxfail=1"
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests",
    "regression: Regression tests",
    "slow: Tests that take a long time to run",
    "smoke: Smoke tests for basic functionality"
]
norecursedirs = [".git", ".venv", "venv", "__pycache__", "build", "dist", "*.egg-info"]

[tool.coverage.run]
branch = true
source = ["openunderstand"]
omit = ["*/tests/*", "*/venv/*", "*/.venv/*", "*/site-packages/*", "*/__pycache__/*", "*/setup.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
    "if TYPE_CHECKING:"
]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PT"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "PT009"]
"__init__.py" = ["F401"]

[tool.ruff.isort]
known-first-party = ["openunderstand"]