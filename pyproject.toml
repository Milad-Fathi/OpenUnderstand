[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short --cov=openunderstand --cov-report=term-missing --cov-report=html:coverage_html --cov-report=xml:coverage.xml --cov-branch --maxfail=1"

[tool.coverage.run]
branch = true
source = ["openunderstand"]

[tool.coverage.report]
fail_under = 80